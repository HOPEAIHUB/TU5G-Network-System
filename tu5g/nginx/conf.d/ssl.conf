# ==============================================================================
# TU5G GATEWAY SSL & SECURITY CONFIGURATION (HAABS COMPLIANT)
# Production-ready reverse proxy configuration with hardened TLS and proxy routing.
# ==============================================================================

# Rate Limiting Zones Configuration
# Zone api_limit: 10MB memory (~160k IPs), Rate: 10 requests/second for API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Zone auth_limit: 10MB memory (~160k IPs), Rate: 5 requests/second for Auth
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream Server Definitions
upstream backend_server {
    server backend:8000;
    keepalive 32;
}

upstream frontend_server {
    server frontend:8080;
    keepalive 32;
}

# HTTP - Redirect all clear-text traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost tu5g-platform.com www.tu5g-platform.com;

    # Certbot / ACME challenge directory for automatic Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Full Secure SSL Virtual Host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost tu5g-platform.com www.tu5g-platform.com;

    # SSL Certificate Paths
    ssl_certificate /etc/nginx/certs/tu5g.crt;
    ssl_certificate_key /etc/nginx/certs/tu5g.key;

    # Strict TLS Configuration (TLS 1.3 ONLY for maximum security)
    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers off;

    # SSL Optimizations
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Hardened Security Headers (HAABS Banking & Auth Compliant)
    # HSTS - Enforce HTTPS for 1 year (31536000 seconds) including subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Enable browser cross-site scripting filter
    add_header X-XSS-Protection "1; mode=block" always;
    # Control referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content Security Policy (allows self, scripts, styles, and WebSocket connections)
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: wss: http: https:;" always;
    # Restrict hardware feature permissions
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=(), fullscreen=(self)" always;

    # High-Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # 1. Specialized Rate-Limited Auth Endpoints Proxy Routing
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. API Services Proxy Routing (FastAPI Backend)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. WebSocket Real-time Telemetry Proxy Routing
    location /telemetry/ws {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. WebSocket AI/User Chat Proxy Routing
    location /chat/ws {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. Frontend Web Application Routing (port 8080)
    location / {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
